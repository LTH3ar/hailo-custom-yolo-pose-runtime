# Release on a version tag (e.g. git tag -a v1.4.0 -m ... && git push origin v1.4.0): the runtime as a Python
# sdist and wheel. (The thesis moved to LTH3ar/hcpose-thesis, which releases its own PDFs; v1.0.3 and v1.1.0 here
# still carry the thesis as it was then.)
# The C++ post-process and Hailo libraries are built on the Pi by install.sh, not here.
name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test
        run: |
          pip install -e ".[test,eval]" opencv-python-headless scikit-learn
          pytest -q tests
      - name: Build the runtime (sdist and wheel)
        run: |
          pip install build
          python -m build --outdir dist
      - name: Check the wheel contains the engagement code and models
        run: |
          python - <<'PY'
          import glob, sys, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          need = ["hcpose/engagement/analyzer.py", "hcpose/engagement/classifier.py",
                  "hcpose/engagement/models/scb_trees.json"]
          missing = [n for n in need if n not in names]
          print("missing from the wheel:", missing) if missing else print(len(names), "files in the wheel, engagement included")
          sys.exit(1 if missing else 0)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: dist/
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
