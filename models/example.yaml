# Model sidecar: copy next to your HEF with the same name
#   models/upper_body_n.hef  ->  models/upper_body_n.yaml
# or pass it explicitly with --config. Every key is optional; delete what you
# don't need. Command-line flags (e.g. --score-threshold) override this file.

# --- detection -------------------------------------------------------------
score_threshold: 0.5        # person confidence
iou_threshold: 0.7          # NMS overlap
keypoint_threshold: 0.5     # joints below this are hidden in the overlay
max_detections: 100
class_agnostic_nms: true
pose_dedup: 0.1             # after NMS, drop a box whose skeleton matches a stronger one
                            # (box inside it, mean joint distance < 0.1 x box size); 0 = off

# Whether the HEF already applies sigmoid to the class-score outputs.
# auto = detect from the output values (recommended). Force with sigmoid/none.
score_activation: auto
keypoint_activation: auto

# --- structure (auto-detected from the HEF; set only if detection fails) ---
# num_keypoints: 13
# num_classes: 1
# reg_max: 16

# --- presentation ------------------------------------------------------------
labels: [person]

# Defaults: 17 keypoints -> COCO names/skeleton, 13 -> upper body (COCO 0..12).
keypoint_names:
  - nose
  - left_eye
  - right_eye
  - left_ear
  - right_ear
  - left_shoulder
  - right_shoulder
  - left_elbow
  - right_elbow
  - left_wrist
  - right_wrist
  - left_hip
  - right_hip

# 0-indexed pairs of keypoints to connect
skeleton:
  - [0, 1]
  - [1, 3]
  - [0, 2]
  - [2, 4]
  - [5, 6]
  - [5, 7]
  - [7, 9]
  - [6, 8]
  - [8, 10]
  - [5, 11]
  - [6, 12]
  - [11, 12]
